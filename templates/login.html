<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="login_title">Survey Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#eef1f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px 36px;width:400px;max-width:92vw}
h1{font-size:1.3rem;font-weight:700;color:#1a2b3c;margin-bottom:4px}
.sub{font-size:.82rem;color:#6b7a8d;margin-bottom:22px;line-height:1.5}
label{display:block;font-size:.78rem;font-weight:600;color:#4a5568;margin-bottom:4px;margin-top:16px}
input{width:100%;padding:10px 12px;border:1.5px solid #d1d9e6;border-radius:7px;font-size:.88rem;transition:.15s}
input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
button[type=submit]{width:100%;padding:11px;background:#1e3a5f;color:#fff;border:none;border-radius:7px;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:24px;transition:.15s}
button[type=submit]:hover{background:#2a4f7f}
.err{background:#fef2f2;color:#b91c1c;padding:8px 12px;border-radius:6px;font-size:.8rem;margin-top:16px}
.foot{text-align:center;margin-top:20px;font-size:.72rem;color:#94a3b8}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:14px}
.lang a{text-decoration:none;font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:5px;border:1px solid #d1d9e6;color:#4a5568}
.lang a.on{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
</style>
</head>
<body>
<div class="card">
    <div class="lang">
        <a href="/set-lang/en" class="{{ 'on' if lang=='en' else '' }}">EN</a>
        <a href="/set-lang/fr" class="{{ 'on' if lang=='fr' else '' }}">FR</a>
        <a href="/set-lang/nl" class="{{ 'on' if lang=='nl' else '' }}">NL</a>
    </div>
    <h1 data-i18n="login_heading">Perceptual Attribute Survey</h1>
    <p class="sub" data-i18n="login_sub">Sign in with the credentials provided by the research team.</p>
    <form method="POST">
        <label for="username" data-i18n="username">Username</label>
        <input id="username" name="username" type="text" placeholder="user1" required autofocus>
        <label for="password" data-i18n="password">Password</label>
        <input id="password" name="password" type="password" required>
        <button type="submit" data-i18n="sign_in">Sign in</button>
        {% if error %}<div class="err" data-i18n="auth_error">Invalid username or password.</div>{% endif %}
    </form>
    <p class="foot" data-i18n="login_foot">Companion survey for the Multimodal-AI Pipeline paper</p>
</div>
<script>
const LANG = "{{ lang }}";
const I18N = {
en:{login_title:"Survey Login",login_heading:"Perceptual Attribute Survey",login_sub:"Sign in with the credentials provided by the research team.",username:"Username",password:"Password",sign_in:"Sign in",auth_error:"Invalid username or password.",login_foot:"Companion survey for the Multimodal-AI Pipeline paper"},
fr:{login_title:"Connexion — Enquête",login_heading:"Enquête sur les attributs perceptuels",login_sub:"Connectez-vous avec les identifiants fournis par l'équipe de recherche.",username:"Nom d'utilisateur",password:"Mot de passe",sign_in:"Se connecter",auth_error:"Nom d'utilisateur ou mot de passe incorrect.",login_foot:"Enquête complémentaire à l'article Multimodal-AI Pipeline"},
nl:{login_title:"Inloggen — Enquête",login_heading:"Enquête perceptuele attributen",login_sub:"Meld u aan met de gegevens die u van het onderzoeksteam hebt ontvangen.",username:"Gebruikersnaam",password:"Wachtwoord",sign_in:"Aanmelden",auth_error:"Ongeldige gebruikersnaam of wachtwoord.",login_foot:"Enquête bij het Multimodal-AI Pipeline-artikel"}
};
const T = I18N[LANG] || I18N.en;
document.querySelectorAll("[data-i18n]").forEach(el => {
  const k = el.getAttribute("data-i18n");
  if (T[k]) el.textContent = T[k];
});
document.title = T.login_title || document.title;
</script>
</body>
</html>
